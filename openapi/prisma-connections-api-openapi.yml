              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: ^(con_)([cC][^\s-]{8,}|[a-z0-9]+)$
                      type:
                        type: string
                        const: connection
                      url:
                        type: string
                        format: uri
                      name:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      kind:
                        type: string
                        enum:
                        - postgres
                        - accelerate
                      endpoints:
                        type: object
                        properties:
                          direct:
                            type: object
                            properties:
                              host:
                                type: string
                              port:
                                type: number
                              connectionString:
                                type: string
                            required:
                            - host
                            - port
                            - connectionString
                          pooled:
                            type: object
                            properties:
                              host:
                                type: string
                              port:
                                type: number
                              connectionString:
                                type: string
                            required:
                            - host
                            - port
                            - connectionString
                          accelerate:
                            type: object
                            properties:
                              host:
                                type: string
                              port:
                                type: number
                              connectionString:
                                type: string
                            required:
                            - host
