naftiko: 1.0.0-alpha2
info:
  label: Prisma Data Platform API — Projects
  description: 'Prisma Data Platform API — Projects. 4 operations. Lead operation: Prisma Get a project. Self-contained Naftiko
    capability covering one Prisma business surface.'
  tags:
  - Prisma
  - Projects
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PRISMA_API_KEY: PRISMA_API_KEY
capability:
