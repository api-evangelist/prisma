principles:
  - name: Visibility
    description: Track Postgres + Accelerate operation counts and storage per environment in the Prisma
      Console; reconcile against the monthly invoice. Plan-level included quotas vs overage are the
      primary cost line.
  - name: Allocation
    description: Allocate by Prisma project / environment / database; tag environments (dev / preview
      / prod) and split overage cost back to the consuming feature team.
  - name: Optimization
    description: Use Accelerate's cache + cache tags to convert Postgres operations into cheaper cached
      operations; right-size the plan when sustained overage on Postgres operations is cheaper at the
      next tier (Pro $0.002/1k vs Starter $0.008/1k vs Business $0.001/1k); paginate to stay under
      the 5 MB response ceiling.
  - name: Accountability
    description: Assign a plan and budget owner per Prisma workspace; alert on overage when monthly
      Postgres operations or Accelerate operations exceed the included allotment.
