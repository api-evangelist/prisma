note: >-
  Prisma publishes no test/live key duality and no hosted sandbox tenant for the Management API —
  there is one set of credentials and one api.prisma.io. What it does publish, and what serves the
  same purpose, is a genuine LOCAL runtime: `prisma dev` runs Prisma Postgres on the developer's
  machine, and the app runs locally on Bun via Composer, with S3-compatible local object storage.
  No test values, magic identifiers or fixture tokens are published, so none are recorded here.
