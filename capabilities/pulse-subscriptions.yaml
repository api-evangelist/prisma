naftiko: 1.0.0-alpha2
info:
  label: Prisma Pulse API — Subscriptions
  description: 'Prisma Pulse API — Subscriptions. 1 operations. Lead operation: Prisma Create a transient event subscription.
    Self-contained Naftiko capability covering one Prisma business surface.'
  tags:
  - Prisma
  - Subscriptions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PRISMA_API_KEY: PRISMA_API_KEY
capability:
  consumes:
  - type: http
    namespace: pulse-subscriptions
    baseUri: https://pulse.prisma-data.net
    description: Prisma Pulse API — Subscriptions business capability. Self-contained, no shared references.
    resources:
    - name: subscribe
      path: /subscribe
      operations:
      - name: createsubscription
        method: POST
        description: Prisma Create a transient event subscription
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.PRISMA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: pulse-subscriptions-rest
    port: 8080
    description: REST adapter for Prisma Pulse API — Subscriptions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/subscribe
      name: subscribe
      description: REST surface for subscribe.
      operations:
      - method: POST
        name: createsubscription
        description: Prisma Create a transient event subscription
        call: pulse-subscriptions.createsubscription
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: pulse-subscriptions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Prisma Pulse API — Subscriptions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: prisma-create-transient-event-subscription
      description: Prisma Create a transient event subscription
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: pulse-subscriptions.createsubscription
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
