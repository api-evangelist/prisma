naftiko: 1.0.0-alpha2
info:
  label: Prisma Client API — Raw
  description: 'Prisma Client API — Raw. 2 operations. Lead operation: Prisma Execute a raw SQL statement. Self-contained
    Naftiko capability covering one Prisma business surface.'
  tags:
  - Prisma
  - Raw
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PRISMA_API_KEY: PRISMA_API_KEY
capability:
  consumes:
  - type: http
    namespace: client-raw
    baseUri: https://localhost:3000/api
    description: Prisma Client API — Raw business capability. Self-contained, no shared references.
    resources:
    - name: raw-execute
      path: /raw/execute
      operations:
      - name: executeraw
        method: POST
        description: Prisma Execute a raw SQL statement
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: raw-query
      path: /raw/query
      operations:
      - name: queryraw
        method: POST
        description: Prisma Execute a raw SQL query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: client-raw-rest
    port: 8080
    description: REST adapter for Prisma Client API — Raw. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/raw/execute
      name: raw-execute
      description: REST surface for raw-execute.
      operations:
      - method: POST
        name: executeraw
        description: Prisma Execute a raw SQL statement
        call: client-raw.executeraw
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/raw/query
      name: raw-query
      description: REST surface for raw-query.
      operations:
      - method: POST
        name: queryraw
        description: Prisma Execute a raw SQL query
        call: client-raw.queryraw
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: client-raw-mcp
    port: 9090
    transport: http
    description: MCP adapter for Prisma Client API — Raw. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: prisma-execute-raw-sql-statement
      description: Prisma Execute a raw SQL statement
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: client-raw.executeraw
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: prisma-execute-raw-sql-query
      description: Prisma Execute a raw SQL query
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: client-raw.queryraw
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
