  docs: https://www.prisma.io/docs/orm/reference/error-reference#DRIVER.PREPARE_FAILED
- code: MIGRATION.AMBIGUOUS_MIGRATION_REF
  namespace: MIGRATION
  meaning: 'A migration reference (directory name or hash prefix) passed to a CLI command matches migrations
    in more than one contract space, so the command cannot tell which one you mean. Re-run with `--space
    <id>` to pick a space. Payload: `ref`, `spaceIds`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.AMBIGUOUS_MIGRATION_REF
- code: MIGRATION.AMBIGUOUS_TARGET
  namespace: MIGRATION
  meaning: 'The on-disk migration history has diverged into multiple branch tips (typically two developers
    planned migrations from the same starting point), so commands that auto-resolve a target cannot choose
    one. Fix by targeting a branch with `ref set`, deleting one of the conflicting migration directories,
    or passing `--from <hash>`. Payload: `branchTips`, and when divergence context is known `divergenceP'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.AMBIGUOUS_TARGET
- code: MIGRATION.BUNDLE_NOT_FOUND_FOR_GRAPH_NODE
  namespace: MIGRATION
  meaning: 'A hash resolves to a node in the migration graph, but no on-disk migration package has that
    hash as its destination (`to`), so there is no bundle to read for it. Hit when resolving a ref or
    hash to a migration bundle (e.g. `migration show`, contract-at resolution). Payload: `hash`, `explicitLabel`
    (when the user supplied a named reference).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.BUNDLE_NOT_FOUND_FOR_GRAPH_NODE
- code: MIGRATION.CHECK_CONTRACT_UNREADABLE
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: the `contract.json` for a contract space cannot be read or validated. Re-emit the extension contract
    artifacts or fix the descriptor producing the invalid contract.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_CONTRACT_UNREADABLE
- code: MIGRATION.CHECK_DANGLING_REF
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: a ref file points at a contract hash that does not exist in the space''s migration graph. Update
    the ref with `prisma ref set <name> <valid-hash>` or delete it.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_DANGLING_REF
- code: MIGRATION.CHECK_DECLARED_BUT_UNMIGRATED
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: an extension is declared in `extensions` but has no on-disk migrations directory under `migrations/`.
    Re-emit the extension''s contract-space artifacts, or remove the extension from `extensions`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_DECLARED_BUT_UNMIGRATED
- code: MIGRATION.CHECK_DUPLICATE_MIGRATION_HASH
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: multiple migration packages in the same contract space share the same `migrationHash`, so the
    packages are not uniquely content-addressed. Re-emit one of the conflicting packages.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_DUPLICATE_MIGRATION_HASH
- code: MIGRATION.CHECK_FILE_MISSING
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: a required file (`migration.json` or `ops.json`) is missing from a migration package directory.
    Re-emit the package or restore it from version control.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_FILE_MISSING
- code: MIGRATION.CHECK_HASH_MISMATCH
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: the `migrationHash` stored in `migration.json` does not match the hash recomputed from the package
    contents — the package was edited or partially written since emit. Re-emit the package or restore
    it from version control.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_HASH_MISMATCH
- code: MIGRATION.CHECK_HEAD_REF_MISSING
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: a contract space has no `refs/head.json`. Re-emit the contract-space migrations and head-ref
    artifacts, or restore the file from version control.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_HEAD_REF_MISSING
- code: MIGRATION.CHECK_HEAD_REF_NOT_IN_GRAPH
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: the hash in a space''s `refs/head.json` is not a node in that space''s migration graph. Re-emit
    the space''s migrations or restore the missing migration package.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_HEAD_REF_NOT_IN_GRAPH
- code: MIGRATION.CHECK_NOOP_SELF_EDGE
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: a migration has identical source and target hashes and declares no data invariant — a true no-op
    self-edge. Add a data operation if it was meant to carry one, or delete the migration.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_NOOP_SELF_EDGE
- code: MIGRATION.CHECK_ORPHAN_SPACE_DIR
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: a contract-space directory exists under `migrations/` but no declared extension claims it. Remove
    the directory or declare the extension in `extensions`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_ORPHAN_SPACE_DIR
- code: MIGRATION.CHECK_PACKAGE_UNLOADABLE
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: a migration package directory exists but could not be loaded (parse or validation failure); the
    row''s detail names the underlying cause. Re-emit the package or restore it from version control.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_PACKAGE_UNLOADABLE
- code: MIGRATION.CHECK_PROVIDED_INVARIANTS_MISMATCH
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: the `providedInvariants` list stored in `migration.json` disagrees with the one derived from
    `ops.json`. Re-emit the package so the two files agree.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_PROVIDED_INVARIANTS_MISMATCH
- code: MIGRATION.CHECK_REF_UNREADABLE
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: a ref file in a space''s `refs/` directory cannot be read or parsed. Repair or remove the corrupt
    ref file.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_REF_UNREADABLE
- code: MIGRATION.CHECK_SNAPSHOT_HASH_MISMATCH
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: a migration declares a destination hash `to` but the contract snapshot stored for that hash has
    a different inner `storage.storageHash`. Re-emit the package so `migration.json` and its snapshot
    agree.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_SNAPSHOT_HASH_MISMATCH
- code: MIGRATION.CHECK_SNAPSHOT_UNPARSEABLE
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: either the migration''s `to` value is not a well-formed 64-hex hash, or the contract snapshot
    stored for it exists but cannot be parsed. Re-emit the package, or restore `migrations/snapshots/`
    from version control.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_SNAPSHOT_UNPARSEABLE
- code: MIGRATION.CHECK_SPACE_DISJOINTNESS_VIOLATION
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: a storage element (table/collection) is claimed by more than one contract space. Update the contracts
    so each storage element is owned by exactly one space.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_SPACE_DISJOINTNESS_VIOLATION
- code: MIGRATION.CHECK_TARGET_MISMATCH
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: a contract space''s declared database target differs from the project''s configured target. Update
    the extension to target the configured database, or change the project target.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_TARGET_MISMATCH
- code: MIGRATION.CHECK_UNREACHABLE_MIGRATION
  namespace: MIGRATION
  meaning: 'A `migration check` finding, carried as an `error` diagnostic on a completed run that exits
    `4`: a migration''s `from` hash is not produced by any other migration (and is not the empty state),
    so the migration is unreachable in the graph. Delete it or re-emit a connecting migration.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CHECK_UNREACHABLE_MIGRATION
- code: MIGRATION.CONSENT_PLAN_MISMATCH
  namespace: MIGRATION
  meaning: An apply carrying consent was refused because the plan recomputed for it is not the plan that
    was consented to. `db update` recomputes the plan at apply time and compares its hash against the
    one the consent was given for; a mismatch means the schema, the contract, or the database moved in
    between, so applying would carry out operations nobody agreed to. Re-run the command and review the
    freshly p
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CONSENT_PLAN_MISMATCH
- code: MIGRATION.CONTRACT_DESERIALIZATION_FAILED
  namespace: MIGRATION
  meaning: 'A contract JSON on disk failed to deserialize into a valid contract: either a snapshot-store
    entry read while migration tooling resolved a contract at a ref or hash, or the emitted `contract.json`
    read as the fallback source by `db sign` / `db update --to` (invalid JSON, or a value that is not
    a JSON object). Re-emit the owning migration package (or re-run `prisma contract emit` for the emitted
    co'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CONTRACT_DESERIALIZATION_FAILED
- code: MIGRATION.CONTRACT_SNAPSHOT_HASH_MISMATCH
  namespace: MIGRATION
  meaning: 'While writing a contract snapshot, the contract JSON''s inner `storage.storageHash` does not
    equal the storage hash the snapshot is being filed under — the two must agree by construction. Primarily
    an authoring/tooling invariant rather than something a user causes directly. Payload: `storageHash`,
    `actualHash`, `dir`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CONTRACT_SNAPSHOT_HASH_MISMATCH
- code: MIGRATION.CONTRACT_SNAPSHOT_MISSING
  namespace: MIGRATION
  meaning: 'A contract snapshot expected under `migrations/snapshots/` for a given storage hash does not
    exist on disk, so commands that need the contract at that hash (`migration plan`, `ref`-based resolution,
    `migration check`) cannot proceed. Re-run the command that authored the referencing migration to regenerate
    the snapshot, or restore `migrations/snapshots/` from version control. Payload: `storageHash`'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CONTRACT_SNAPSHOT_MISSING
- code: MIGRATION.CONTRACT_SPACE_LAYOUT_VIOLATION
  namespace: MIGRATION
  meaning: 'The on-disk `migrations/` directory and the `extensions` declaration in config disagree: an
    orphan space directory exists with no declaring extension, or a declared extension has no migrations
    directory. All layout offences are bundled into one envelope. Raised when db commands load the contract-space
    aggregate. Payload: `violations` (list of `{kind, spaceId}`).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CONTRACT_SPACE_LAYOUT_VIOLATION
- code: MIGRATION.CONTRACT_SPACE_VIOLATION
  namespace: MIGRATION
  meaning: 'A contract-space check raised under one code, in two lanes with different exits. As an error
    at exit `2` when the check could not run: a space''s target mismatches the project target, two spaces
    claim the same storage element, a space contract is unreadable, or aggregate introspection failed
    (`db verify`, `db run`). As an `error`-severity diagnostic on a completed `db verify` run that exits
    `4` — i'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CONTRACT_SPACE_VIOLATION
- code: MIGRATION.CONTRACT_VIEW_MISSING
  namespace: MIGRATION
  meaning: 'A migration object''s `endContract`/`startContract` accessor was read, but the instance carries
    no `endContractJson`/`startContractJson` to build the contract view from — typically a migration that
    overrides `describe()` and carries no contract. Payload: `className`, `accessor`, `jsonField`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.CONTRACT_VIEW_MISSING
- code: MIGRATION.DATA_TRANSFORM_CONTRACT_MISMATCH
  namespace: MIGRATION
  meaning: 'At migration authoring/emit time, a `dataTransform(endContract, …)` produced a query plan
    whose storage hash does not match the contract passed to `dataTransform` — the query builder was configured
    with a different contract reference than the migration itself. Make both use the same imported `endContract`.
    Payload: `dataTransformName`, `expected`, `actual`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.DATA_TRANSFORM_CONTRACT_MISMATCH
- code: MIGRATION.DESCRIBE_INVALID
  namespace: MIGRATION
  meaning: 'A migration author class''s `describe()` result is unusable: it carries neither an `endContractJson`
    nor an override, or the returned metadata fails validation. Raised while loading/describing an authored
    migration. Payload: `reason`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.DESCRIBE_INVALID
- code: MIGRATION.DESCRIPTOR_HEAD_HASH_MISMATCH
  namespace: MIGRATION
  meaning: 'An extension descriptor publishes a `contractSpace` whose `headRef.hash` does not match the
    hash recomputed from its `contractJson` — the descriptor was published with a stale head hash, typically
    because the contract was bumped without rerunning the extension''s emit pipeline. Payload: `extensionId`,
    `recomputedHash`, `headRefHash`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.DESCRIPTOR_HEAD_HASH_MISMATCH
- code: MIGRATION.DESTINATION_CONTRACT_MISMATCH
  namespace: MIGRATION
  meaning: 'Runner-level failure during apply (`db init`, `db update`, `migrate`): the plan''s destination
    storage hash (or profile hash) does not match the destination contract handed to the runner alongside
    it. Indicates the plan and contract came from different emits. Payload: `planStorageHash`/`contractStorageHash`
    (or `planProfileHash`/`contractProfileHash`).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.DESTINATION_CONTRACT_MISMATCH
- code: MIGRATION.DESTRUCTIVE_CHANGES
  namespace: MIGRATION
  meaning: 'The planned operations include destructive changes (e.g. DROP) and the command was run without
    explicit consent. `db update` asks for that consent instead of failing: interactively it asks you
    to type the name of the database it is about to change, and outside an interactive terminal it is
    granted by `--confirm <database>` (`--yes` accepts declared prompt defaults and never grants consent;
    `--conf'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.DESTRUCTIVE_CHANGES
- code: MIGRATION.DIR_EXISTS
  namespace: MIGRATION
  meaning: '`migration new`/`migration plan` refused to scaffold because the target migration directory
    already exists — each migration needs a unique directory. Pick a different `--name` or delete the
    existing directory. Payload: `dir`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.DIR_EXISTS
- code: MIGRATION.DUPLICATE_INVARIANT_IN_EDGE
  namespace: MIGRATION
  meaning: 'Two `dataTransform` operations on the same migration declare the same `invariantId`. Invariants
    are stored per-migration as a set, so two operations cannot share a routing identity; rename one,
    or drop the `invariantId` on the operation that need not be routing-visible. Payload: `invariantId`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.DUPLICATE_INVARIANT_IN_EDGE
- code: MIGRATION.DUPLICATE_MIGRATION_HASH
  namespace: MIGRATION
  meaning: 'While reconstructing the migration graph, two migrations were found sharing the same `migrationHash`;
    each migration must have a unique content-addressed identity. Regenerate one of the conflicting migrations.
    Payload: `migrationHash`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.DUPLICATE_MIGRATION_HASH
- code: MIGRATION.DUPLICATE_SPACE_ID
  namespace: MIGRATION
  meaning: 'The per-space migration planner received the same contract-space id more than once, usually
    a repeated entry in `extensions`. Deduplicate the inputs. Payload: `spaceId`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.DUPLICATE_SPACE_ID
- code: MIGRATION.EXECUTION_FAILED
  namespace: MIGRATION
  meaning: 'A migration operation''s SQL step failed while being executed against the database during
    apply (`db init`, `db update`, `migrate`). The envelope carries the database error detail so you can
    see which statement failed and why. Payload: `operationId`, `stepDescription`, `sql`, `sqlState`,
    `constraint`, `table`, `column`, `detail`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.EXECUTION_FAILED
- code: MIGRATION.FILE_MISSING
  namespace: MIGRATION
  meaning: 'A required migration file is absent: either an on-disk package is missing `migration.json`/`ops.json`
    (migration-tools loader — re-emit via the package''s `migration.ts`), or a `migration.ts` source file
    was expected at a package directory and not found (scaffold one with `migration new` or `migration
    plan`). Payload: `file`, `dir` (loader variant) or `dir` (source-file variant).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.FILE_MISSING
- code: MIGRATION.FOREIGN_KEY_VIOLATION
  namespace: MIGRATION
  meaning: 'SQLite only: after applying migration plans with `PRAGMA foreign_keys` temporarily off (needed
    for recreate-table operations), the post-apply `PRAGMA foreign_key_check` reported broken references,
    and the whole transaction is rolled back. Payload: `violations` (rows from the pragma).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.FOREIGN_KEY_VIOLATION
- code: MIGRATION.HASH_MISMATCH
  namespace: MIGRATION
  meaning: 'A migration package on disk is corrupt: the `migrationHash` stored in `migration.json` does
    not match the hash recomputed from the package contents. Raised whenever migration tooling loads packages
    (plan, list, apply). Re-emit the package via its `migration.ts` or restore from version control. Payload:
    `dir`, `storedHash`, `computedHash`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.HASH_MISMATCH
- code: MIGRATION.HASH_NOT_IN_GRAPH
  namespace: MIGRATION
  meaning: 'A contract hash the user supplied (or that a ref resolved to) is not a node in the on-disk
    migration graph — raised during plan resolution (`migration plan --from`), `ref set`, and `migration
    new --from`. The envelope lists the reachable hashes and suggests a valid one or running `migration
    plan` to introduce it. Payload: `hash`/`resolvedHash`, `reachableHashes` or `reachableRefs`, sometimes
    `grap'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.HASH_NOT_IN_GRAPH
- code: MIGRATION.INVALID_DEFAULT_EXPORT
  namespace: MIGRATION
  meaning: 'The `migration.ts` in a package directory does not default-export a valid migration: it must
    export a `Migration` subclass or a factory function returning a plan-shaped object (`operations` array
    plus `targetId` and `destination`). Payload: `dir`, `actualExport` (when known).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.INVALID_DEFAULT_EXPORT
- code: MIGRATION.INVALID_DEST_NAME
  namespace: MIGRATION
  meaning: 'A copy-destination name in a migration package''s copy list is not a single path segment (contains
    `..` or directory separators). Use a simple file name such as `contract.json`. Payload: `destName`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.INVALID_DEST_NAME
- code: MIGRATION.INVALID_INVARIANT_ID
  namespace: MIGRATION
  meaning: 'An `invariantId` on a `dataTransform` is empty or contains whitespace/control characters.
    Pick an id without spaces, tabs, newlines, or control characters. Payload: `invariantId`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.INVALID_INVARIANT_ID
- code: MIGRATION.INVALID_JSON
  namespace: MIGRATION
  meaning: 'A migration file (`migration.json` or `ops.json`) exists but is not parseable JSON. Re-emit
    the package via its `migration.ts` or restore from version control. Payload: `filePath`, `parseError`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.INVALID_JSON
- code: MIGRATION.INVALID_MANIFEST
  namespace: MIGRATION
  meaning: 'A `migration.json` manifest parsed as JSON but failed schema validation. Re-emit the package
    or restore from version control. Payload: `filePath`, `reason`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.INVALID_MANIFEST
- code: MIGRATION.INVALID_NAME
  namespace: MIGRATION
  meaning: 'The migration name given to `migration new`/`migration plan --name` contains no valid characters
    after sanitization (only a-z and 0-9 are kept). Provide a name with at least one alphanumeric character.
    Payload: `slug`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.INVALID_NAME
- code: MIGRATION.INVALID_OPERATION_ENTRY
  namespace: MIGRATION
  meaning: 'An operation returned by an authored migration class failed schema validation during emit
    — each entry of `operations` must carry `id`, `label`, and an `operationClass` of `additive`, `widening`,
    `destructive`, or `data`. Also raised when deserializing a persisted Mongo migration plan hits a malformed
    or unknown entry (filter, pipeline stage, DML/DDL/inspection command). Payload: `index`, `reason`'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.INVALID_OPERATION_ENTRY
- code: MIGRATION.INVALID_REF_FILE
  namespace: MIGRATION
  meaning: 'A ref file under `migrations/<space>/refs/` is not valid JSON or does not match the expected
    `{ "hash": "<64 hex>", "invariants": [...] }` shape. Payload: `path`, `reason`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.INVALID_REF_FILE
- code: MIGRATION.INVALID_REF_NAME
  namespace: MIGRATION
  meaning: 'A ref name is syntactically invalid: names must be lowercase alphanumeric with hyphens or
    forward slashes, with no `.` or `..` segments. Raised by `ref` commands and any ref-consuming tooling.
    Payload: `refName`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.INVALID_REF_NAME
- code: MIGRATION.INVALID_REF_VALUE
  namespace: MIGRATION
  meaning: 'The value given for a ref (e.g. to `ref set`) is not a valid contract hash — it must be 64
    lowercase hex chars or `empty`. Payload: `value`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.INVALID_REF_VALUE
- code: MIGRATION.INVALID_REFS
  namespace: MIGRATION
  meaning: 'A legacy `refs.json` file is invalid — it must be a flat object mapping valid ref names to
    contract hash strings. Payload: `path`, `reason`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.INVALID_REFS
- code: MIGRATION.INVALID_SPACE_ID
  namespace: MIGRATION
  meaning: 'A contract-space id (e.g. via `--space` or in planner input) does not match the required pattern
    `[a-z][a-z0-9_-]{0,63}` — space ids double as directory names under `migrations/`, so the rule is
    conservative. Payload: `spaceId`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.INVALID_SPACE_ID
- code: MIGRATION.LEGACY_MARKER_SHAPE
  namespace: MIGRATION
  meaning: 'The database''s marker table (`prisma_contract.marker` on Postgres, `_prisma_marker` on SQLite)
    has the pre-per-space shape (no `space` column). The transitional auto-migration has been removed;
    drop the marker table and re-run `prisma db init` to reinitialise from a clean baseline. Detected
    during `db init`/`db update`/apply. Payload: `table`, `columns` (runner variant) or `runnerErrorCode`
    (marke'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.LEGACY_MARKER_SHAPE
- code: MIGRATION.LEGEND_HUMAN_ONLY
  namespace: MIGRATION
  meaning: '`migration list --legend` was combined with a machine-readable or silent output flag (`--json`,
    `--dot`, or `--quiet`); the legend is human-only decoration on stderr. Drop one of the flags. Payload:
    `conflictingFlag`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.LEGEND_HUMAN_ONLY
- code: MIGRATION.MARKER_CAS_FAILURE
  namespace: MIGRATION
  meaning: 'While finalizing an apply, the compare-and-swap update of the database''s contract marker
    found the marker had been modified by another process mid-migration — a concurrent migration raced
    this one. Payload: `space`, `expectedStorageHash`, `destinationStorageHash`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.MARKER_CAS_FAILURE
- code: MIGRATION.MARKER_MISMATCH
  namespace: MIGRATION
  meaning: 'The live database marker''s contract hash is not reachable anywhere in the on-disk migration
