source: https://www.prisma.io/docs/orm/reference/error-reference
api: Prisma ORM (client, CLI, migrations, drivers)
scheme: dotted NAMESPACE.SUBCODE structured error envelopes (ADR 239)
note: Prisma ORM errors are structured envelopes, not HTTP problem documents. Each carries message and
  optionally why, fix, where, cause, docsUrl and a structured payload on error.meta or error.details.
  Match programmatically with isStructuredError from the facade package's utils/structured-error subpath
  and compare error.code -- never instanceof. The legacy P-numbered codes (P1001/P2002/P6009 and friends)
  were renamed at 0.16; ADR 239 carries the old->new crosswalk. This registry is generated in the prisma/prisma
  repository and its CI requires every code in production source to be documented before it ships.
envelope_fields:
- message
- why
- fix
- where
- cause
- docsUrl
- meta
- details
exit_codes:
  '1': internal error (a bug)
  '2': expected structured failure
  '3': user abort
  4-99: completed with findings; per-command documented code (db verify, db sign, migration check, orm
    init)
