openapi: 3.2.0
info:
  title: Prisma Databases API
  version: '1.0'
  description: 'Operations tagged Databases across 2 of this provider''s published API definitions: prisma-postgres-management-api-openapi.json, prisma-postgres-management-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prisma.io
- url: https://api.prisma.io/v1
  description: Prisma Management API production server
tags:
- name: Databases
paths:
  /v1/databases:
    get:
      responses:
        '200':
          description: Returns the list of databases.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          const: database
                        url:
                          type: string
                          format: uri
                        name:
                          type: string
                        status:
                          type: string
                          enum:
                          - failure
                          - provisioning
                          - ready
                          - recovering
                        createdAt:
                          type: string
                          format: date-time
                        isDefault:
                          type: boolean
                        defaultConnectionId:
                          type:
                          - string
                          - 'null'
                          pattern: ^(con_)([cC][^\s-]{8,}|[a-z0-9]+)$
                        connections:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                pattern: ^(con_)([cC][^\s-]{8,}|[a-z0-9]+)$
                              type:
                                type: string
                                const: connection
                              url:
                                type: string
                                format: uri
                              name:
                                type: string
                              createdAt:
                                type: string
                                format: date-time
                              kind:
                                type: string
                                enum:
                                - postgres
                                - accelerate
                              endpoints:
                                type: object
                                properties:
                                  direct:
                                    type: object
                                    properties:
                                      host:
                                        type: string
                                      port:
                                        type: number
                                    required:
                                    - host
                                    - port
                                  pooled:
                                    type: object
                                    properties:
                                      host:
                                        type: string
                                      port:
                                        type: number
                                    required:
                                    - host
                                    - port
                                  accelerate:
                                    type: object
                                    properties:
                                      host:
                                        type: string
                                      port:
                                        type: number
                                    required:
                                    - host
                                    - port
                              directConnection:
                                type:
                                - object
                                - 'null'
                                properties:
                                  host:
                                    type: string
                                  pass:
                                    type: string
                                  user:
                                    type: string
                                required:
                                - host
                                - pass
                                - user
                                deprecated: true
                                description: 'Deprecated: use `endpoints.direct` instead.'
                              database:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  url:
                                    type: string
                                    format: uri
                                  name:
                                    type: string
                                required:
                                - id
                                - url
                                - name
                            required:
                            - id
                            - type
                            - url
                            - name
                            - createdAt
                            - kind
                            - endpoints
                            - database
                        project:
                          type: object
                          properties:
                            id:
                              type: string
                            url:
                              type: string
                              format: uri
                            name:
                              type: string
                          required:
                          - id
                          - url
                          - name
                        region:
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                          required:
                          - id
                          - name
                        source:
                          oneOf:
                          - type: object
                            properties:
                              type:
                                type: string
                                const: empty
                            required:
                            - type
                          - type: object
                            properties:
                              type:
                                type: string
                                const: backup
                              databaseId:
                                type: string
                              backupId:
                                type: string
                                description: ID of the backup to restore from
                            required:
                            - type
                            - databaseId
                            - backupId
                          - type: object
                            properties:
                              type:
                                type: string
                                const: database
                              databaseId:
                                type: string
                            required:
                            - type
                            - databaseId
                          - type: 'null'
                        branchId:
                          type:
                          - string
                          - 'null'
                      required:
                      - id
                      - type
                      - url
                      - name
                      - status
                      - createdAt
                      - isDefault
                      - defaultConnectionId
                      - connections
                      - project
                      - region
                      - source
                      - branchId
                  pagination:
                    type: object
                    properties:
                      nextCursor:
                        type:
                        - string
                        - 'null'
                        description: Next cursor to continue pagination
                      hasMore:
                        type: boolean
                        description: Whether there are more items to paginate
                    required:
                    - nextCursor
                    - hasMore
                required:
                - data
                - pagination
        '401':
          description: Missing or invalid authorization token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      hint:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
        '403':
          description: Actor does not have access to the requested databases.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      hint:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
      operationId: getV1Databases
      tags:
      - Databases
      parameters:
      - in: query
        name: cursor
        schema:
          type:
          - string
          - 'null'
          description: Cursor for pagination
      - in: query
        name: limit
        schema:
          type: number
          default: 100
          description: Limit for pagination
      - in: query
        name: projectId
        schema:
          type: string
          pattern: ^(proj_)?([cC][^\s-]{8,}|[a-z0-9]+)$
          description: Filter databases by project ID
      - in: query
        name: branchId
        schema:
          anyOf:
          - type: string
            const: unassigned
          - type: string
            pattern: ^(br_)?([cC][^\s-]{8,}|[a-z0-9]+)$
      - in: query
        name: branchGitName
        schema:
          type: string
          minLength: 1
      summary: List databases
      description: Returns all databases the token has access to. Optionally filter by project ID.
      security:
      - OAuth2:
        - workspace:admin
        - offline_access
      - Bearer: []
    post:
      responses:
        '201':
          description: Created a new database.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                        const: database
                      url:
                        type: string
                        format: uri
                      name:
                        type: string
                      status:
                        type: string
                        enum:
                        - failure
                        - provisioning
                        - ready
                        - recovering
                      createdAt:
                        type: string
                        format: date-time
                      isDefault:
                        type: boolean
                      defaultConnectionId:
                        type:
                        - string
                        - 'null'
                        pattern: ^(con_)([cC][^\s-]{8,}|[a-z0-9]+)$
                      connections:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              pattern: ^(con_)([cC][^\s-]{8,}|[a-z0-9]+)$
                            type:
                              type: string
                              const: connection
                            url:
                              type: string
                              format: uri
                            name:
                              type: string
                            createdAt:
                              type: string
                              format: date-time
                            kind:
                              type: string
                              enum:
                              - postgres
                              - accelerate
                            endpoints:
                              type: object
                              properties:
                                direct:
                                  type: object
                                  properties:
                                    host:
                                      type: string
                                    port:
                                      type: number
                                    connectionString:
                                      type: string
                                  required:
                                  - host
                                  - port
                                pooled:
                                  type: object
                                  properties:
                                    host:
                                      type: string
                                    port:
                                      type: number
                                    connectionString:
                                      type: string
                                  required:
                                  - host
                                  - port
                                accelerate:
                                  type: object
                                  properties:
                                    host:
                                      type: string
                                    port:
                                      type: number
                                    connectionString:
                                      type: string
                                  required:
                                  - host
                                  - port
                            directConnection:
                              type:
                              - object
                              - 'null'
                              properties:
                                host:
                                  type: string
                                pass:
                                  type: string
                                user:
                                  type: string
                              required:
                              - host
                              - pass
                              - user
                              deprecated: true
                              description: 'Deprecated: use `endpoints.direct` instead.'
                            database:
                              type: object
                              properties:
                                id:
                                  type: string
                                url:
                                  type: string
                                  format: uri
                                name:
                                  type: string
                              required:
                              - id
                              - url
                              - name
                          required:
                          - id
                          - type
                          - url
                          - name
                          - createdAt
                          - kind
                          - endpoints
                          - database
                      project:
                        type: object
                        properties:
                          id:
                            type: string
                          url:
                            type: string
                            format: uri
                          name:
                            type: string
                        required:
                        - id
                        - url
                        - name
                      region:
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                        required:
                        - id
                        - name
                      source:
                        oneOf:
                        - type: object
                          properties:
                            type:
                              type: string
                              const: empty
                          required:
                          - type
                        - type: object
                          properties:
                            type:
                              type: string
                              const: backup
                            databaseId:
                              type: string
                            backupId:
                              type: string
                              description: ID of the backup to restore from
                          required:
                          - type
                          - databaseId
                          - backupId
                        - type: object
                          properties:
                            type:
                              type: string
                              const: database
                            databaseId:
                              type: string
                          required:
                          - type
                          - databaseId
                        - type: 'null'
                      branchId:
                        type:
                        - string
                        - 'null'
                    required:
                    - id
                    - type
                    - url
                    - name
                    - status
                    - createdAt
                    - isDefault
                    - defaultConnectionId
                    - connections
                    - project
                    - region
                    - source
                    - branchId
                required:
                - data
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      hint:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
        '401':
          description: Missing or invalid authorization token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      hint:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
        '403':
          description: Actor does not have access to the specified project.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      hint:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
        '404':
          description: Project not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      hint:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
      operationId: postV1Databases
      tags:
      - Databases
      parameters: []
      summary: Create database
      description: Creates a new database in the specified project.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  pattern: ^(proj_)?([cC][^\s-]{8,}|[a-z0-9]+)$
                  description: ID of the project to create the database in
                region:
                  type: string
                  enum:
                  - us-east-1
                  - us-west-1
                  - eu-west-3
                  - eu-central-1
                  - ap-northeast-1
                  - ap-southeast-1
                  - inherit
                  default: us-east-1
                  description: Use "inherit" to use the project's default region (falls back to the default database's region for projects without one).
                name:
                  type: string
                  minLength: 1
                  description: Display name for the database
                isDefault:
                  type: boolean
                  default: false
                  description: Whether this is the default database
                source:
                  oneOf:
                  - type: object
                    properties:
                      type:
                        type: string
                        const: empty
                    required:
                    - type
                  - type: object
                    properties:
                      type:
                        type: string
                        const: backup
                      databaseId:
                        type: string
                        pattern: ^(db_)?([cC][^\s-]{8,}|[a-z0-9]+)$
                        description: ID of the database the backup belongs to
                      backupId:
                        type: string
                        description: ID of the backup to restore from
                    required:
                    - type
                    - databaseId
                    - backupId
                  - type: object
                    properties:
                      type:
                        type: string
                        const: database
                      databaseId:
                        type: string
                        pattern: ^(db_)?([cC][^\s-]{8,}|[a-z0-9]+)$
                        description: ID of the database to clone from
                    required:
                    - type
                    - databaseId
                  description: Source to create the database from. Omit to create an empty database.
                branchId:
                  type:
                  - string
                  - 'null'
                  pattern: ^(br_)?([cC][^\s-]{8,}|[a-z0-9]+)$
                  description: ID of the Branch to attach the database to. Omit to attach the database to the project's default Branch. Every database belongs to a Branch, so null is rejected.
                branchGitName:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  description: Git name of the Branch to attach the database to; the Branch is created when it does not exist. Mutually exclusive with branchId. Omit to attach to the project's default Branch. Every database belongs to a Branch, so null is rejected.
              required:
              - projectId
      security:
      - OAuth2:
        - workspace:admin
        - offline_access
      - Bearer: []
    servers:
    - url: https://api.prisma.io
