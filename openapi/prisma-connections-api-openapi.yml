                          pooled:
                            type: object
                            properties:
                              host:
                                type: string
                              port:
                                type: number
                            required:
                            - host
                            - port
                          accelerate:
                            type: object
                            properties:
                              host:
                                type: string
                              port:
                                type: number
                            required:
                            - host
                            - port
                      directConnection:
                        type:
                        - object
                        - 'null'
                        properties:
                          host:
                            type: string
                          pass:
                            type: string
                          user:
                            type: string
                        required:
                        - host
                        - pass
                        - user
                        deprecated: true
                        description: 'Deprecated: use `endpoints.direct` instead.'
                      database:
                        type: object
                        properties:
                          id:
                            type: string
                          url:
                            type: string
                            format: uri
                          name:
                            type: string
                        required:
                        - id
                        - url
                        - name
                    required:
                    - id
                    - type
                    - url
                    - name
                    - createdAt
                    - kind
                    - endpoints
                    - database
                required:
                - data
        '401':
          description: Missing or invalid authorization token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      hint:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
        '404':
          description: Connection with the given ID was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      hint:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
      operationId: getV1ConnectionsById
      tags:
      - Connections
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^(con_)?([cC][^\s-]{8,}|[a-z0-9]+)$
        required: true
      summary: Get connection
      description: Returns the connection with the given ID.
      security:
      - OAuth2:
        - workspace:admin
        - offline_access
      - Bearer: []
    delete:
      responses:
        '204':
          description: Deleted the connection.
        '401':
          description: Missing or invalid authorization token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      hint:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
        '404':
          description: Connection with the given ID was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      hint:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
      operationId: deleteV1ConnectionsById
      tags:
      - Connections
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^(con_)?([cC][^\s-]{8,}|[a-z0-9]+)$
        required: true
      summary: Delete connection
      description: Deletes the connection with the given ID.
      security:
      - OAuth2:
        - workspace:admin
        - offline_access
      - Bearer: []
    servers:
    - url: https://api.prisma.io
  /v1/connections/{id}/rotate:
    post:
      responses:
        '200':
          description: Rotated connection credentials.
          content:
