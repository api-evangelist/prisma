naftiko: 1.0.0-alpha2
info:
  label: Prisma Optimize API — Metrics
  description: 'Prisma Optimize API — Metrics. 1 operations. Lead operation: Prisma Get session performance metrics. Self-contained
    Naftiko capability covering one Prisma business surface.'
  tags:
  - Prisma
  - Metrics
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PRISMA_API_KEY: PRISMA_API_KEY
capability:
  consumes:
  - type: http
    namespace: optimize-metrics
    baseUri: https://optimize.prisma-data.net
    description: Prisma Optimize API — Metrics business capability. Self-contained, no shared references.
    resources:
    - name: sessions-sessionId-metrics
      path: /sessions/{sessionId}/metrics
      operations:
      - name: getsessionmetrics
        method: GET
        description: Prisma Get session performance metrics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.PRISMA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: optimize-metrics-rest
    port: 8080
    description: REST adapter for Prisma Optimize API — Metrics. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/sessions/{sessionid}/metrics
      name: sessions-sessionid-metrics
      description: REST surface for sessions-sessionId-metrics.
      operations:
      - method: GET
        name: getsessionmetrics
        description: Prisma Get session performance metrics
        call: optimize-metrics.getsessionmetrics
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: optimize-metrics-mcp
    port: 9090
    transport: http
    description: MCP adapter for Prisma Optimize API — Metrics. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: prisma-get-session-performance-metrics
      description: Prisma Get session performance metrics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: optimize-metrics.getsessionmetrics
      outputParameters:
      - type: object
        mapping: $.
