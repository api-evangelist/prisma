openapi: 3.2.0
info:
  title: Prisma Connections API
  version: '1.0'
  description: 'Operations tagged Connections across 2 of this provider''s published API definitions: prisma-postgres-management-api-openapi.json, prisma-postgres-management-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prisma.io
- url: https://api.prisma.io/v1
  description: Prisma Management API production server
tags:
- name: Connections
paths:
  /v1/connections:
    get:
      responses:
        '200':
          description: Returned list of connections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          pattern: ^(con_)([cC][^\s-]{8,}|[a-z0-9]+)$
                        type:
                          type: string
                          const: connection
                        url:
                          type: string
                          format: uri
                        name:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        kind:
                          type: string
                          enum:
                          - postgres
                          - accelerate
                        endpoints:
                          type: object
                          properties:
                            direct:
                              type: object
                              properties:
                                host:
                                  type: string
                                port:
                                  type: number
                              required:
                              - host
                              - port
                            pooled:
                              type: object
                              properties:
                                host:
                                  type: string
                                port:
                                  type: number
                              required:
                              - host
                              - port
                            accelerate:
                              type: object
                              properties:
                                host:
                                  type: string
                                port:
                                  type: number
                              required:
                              - host
                              - port
                        directConnection:
                          type:
                          - object
                          - 'null'
                          properties:
                            host:
                              type: string
                            pass:
                              type: string
                            user:
                              type: string
                          required:
                          - host
                          - pass
                          - user
                          deprecated: true
                          description: 'Deprecated: use `endpoints.direct` instead.'
                        database:
                          type: object
                          properties:
                            id:
                              type: string
                            url:
                              type: string
                              format: uri
                            name:
                              type: string
                          required:
                          - id
                          - url
                          - name
                      required:
                      - id
                      - type
                      - url
                      - name
                      - createdAt
                      - kind
                      - endpoints
                      - database
                  pagination:
                    type: object
                    properties:
                      nextCursor:
                        type:
                        - string
                        - 'null'
                        description: Next cursor to continue pagination
                      hasMore:
                        type: boolean
                        description: Whether there are more items to paginate
                    required:
                    - nextCursor
                    - hasMore
                required:
                - data
                - pagination
        '401':
          description: Missing or invalid authorization token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      hint:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
      operationId: getV1Connections
      tags:
      - Connections
      parameters:
      - in: query
        name: cursor
        schema:
          type:
          - string
          - 'null'
          description: Cursor for pagination
      - in: query
        name: limit
        schema:
          type: number
          default: 100
          description: Limit for pagination
      - in: query
        name: databaseId
        schema:
          type: string
          pattern: ^(db_)?([cC][^\s-]{8,}|[a-z0-9]+)$
      summary: List connections
      description: Returns all connections the actor has access to, with optional database filter.
      security:
      - OAuth2:
        - workspace:admin
        - offline_access
      - Bearer: []
    post:
      responses:
        '201':
          description: Created a new connection.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: ^(con_)([cC][^\s-]{8,}|[a-z0-9]+)$
                      type:
                        type: string
                        const: connection
                      url:
                        type: string
                        format: uri
                      name:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      kind:
                        type: string
                        enum:
                        - postgres
                        - accelerate
                      endpoints:
                        type: object
                        properties:
                          direct:
                            type: object
                            properties:
                              host:
                                type: string
                              port:
                                type: number
                              connectionString:
                                type: string
                            required:
                            - host
                            - port
                            - connectionString
                          pooled:
                            type: object
                            properties:
                              host:
                                type: string
                              port:
                                type: number
                              connectionString:
                                type: string
                            required:
                            - host
                            - port
                            - connectionString
                          accelerate:
                            type: object
                            properties:
                              host:
                                type: string
                              port:
                                type: number
                              connectionString:
                                type: string
                            required:
                            - host
                            - port
                            - connectionString
                      connectionString:
                        type: string
                        deprecated: true
                        description: 'Deprecated: use `endpoints.direct.connectionString` or `endpoints.pooled.connectionString` instead.'
                      directConnection:
                        type:
                        - object
                        - 'null'
                        properties:
                          host:
                            type: string
                          pass:
                            type: string
                          user:
                            type: string
                        required:
                        - host
                        - pass
                        - user
                        deprecated: true
                        description: 'Deprecated: use `endpoints.direct` instead.'
                      database:
                        type: object
                        properties:
                          id:
                            type: string
                          url:
                            type: string
                            format: uri
                          name:
                            type: string
                        required:
                        - id
                        - url
                        - name
                      host:
                        type:
                        - string
                        - 'null'
                        deprecated: true
                        description: 'Deprecated: use `endpoints.direct` instead.'
                      pass:
                        type:
                        - string
                        - 'null'
                        deprecated: true
                        description: 'Deprecated: use `endpoints.direct.connectionString` or `endpoints.pooled.connectionString` instead.'
                      user:
                        type:
                        - string
                        - 'null'
                        deprecated: true
                        description: 'Deprecated: use `endpoints.direct.connectionString` or `endpoints.pooled.connectionString` instead.'
                    required:
                    - id
                    - type
                    - url
                    - name
                    - createdAt
                    - kind
                    - endpoints
                    - connectionString
                    - database
                    - host
                    - pass
                    - user
                required:
                - data
        '401':
          description: Missing or invalid authorization token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      hint:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
        '404':
          description: Database with the given ID was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      hint:
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
      operationId: postV1Connections
      tags:
      - Connections
      parameters: []
      summary: Create connection
      description: Creates a new connection for the specified database.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                databaseId:
                  type: string
                  pattern: ^(db_)?([cC][^\s-]{8,}|[a-z0-9]+)$
                name:
                  type: string
                  minLength: 3
                  maxLength: 65
              required:
              - databaseId
              - name
      security:
      - OAuth2:
        - workspace:admin
        - offline_access
      - Bearer: []
    servers:
    - url: https://api.prisma.io
  /v1/connections/{id}:
    get:
      responses:
        '200':
          description: Returned the connection.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: ^(con_)([cC][^\s-]{8,}|[a-z0-9]+)$
                      type:
                        type: string
                        const: connection
                      url:
                        type: string
                        format: uri
                      name:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      kind:
                        type: string
                        enum:
                        - postgres
                        - accelerate
                      endpoints:
                        type: object
                        properties:
                          direct:
                            type: object
                            properties:
                              host:
                                type: string
                              port:
                                type: number
                            required:
                            - host
