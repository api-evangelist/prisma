naftiko: 1.0.0-alpha2
info:
  label: Prisma Accelerate API
  description: API for Prisma Accelerate, a fully managed global connection pool and caching layer for existing databases.
    Accelerate intercepts Prisma Client queries via a proxy protocol, applies query-level cache policies with configurable
    TTL and stale-while-revalidate strategies, and provides tag-based cache invalidation. The proxy uses the prisma:// connection
    protocol to route queries through Accelerate's global edge network.
  tags:
  - Prisma
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: prisma
    baseUri: https://accelerate.prisma-data.net
    description: Prisma Accelerate API HTTP API.
    authentication:
      type: apikey
      in: header
      name: Authorization
      value: '{{PRISMA_TOKEN}}'
    resources:
    - name: apiversion-enginehash-graphql
      path: /{apiVersion}/{engineHash}/graphql
      operations:
      - name: executequery
        method: POST
        description: Prisma Execute a proxied database query
        inputParameters:
        - name: apiVersion
          in: path
          type: string
          required: true
          description: Prisma engine API version
        - name: engineHash
          in: path
          type: string
          required: true
          description: Prisma engine version hash for protocol compatibility
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: invalidate
      path: /invalidate
      operations:
      - name: invalidatecachebytags
        method: POST
        description: Prisma Invalidate cache entries by tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: invalidate-all
      path: /invalidate-all
      operations:
      - name: invalidateallcache
        method: POST
        description: Prisma Invalidate all cache entries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: health
      path: /health
      operations:
      - name: gethealthstatus
        method: GET
        description: Prisma Check Accelerate service health
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: prisma-rest
    description: REST adapter for Prisma Accelerate API.
    resources:
    - path: /{apiVersion}/{engineHash}/graphql
      name: executequery
      operations:
      - method: POST
        name: executequery
        description: Prisma Execute a proxied database query
        call: prisma.executequery
        with:
          apiVersion: rest.apiVersion
          engineHash: rest.engineHash
        outputParameters:
        - type: object
          mapping: $.
    - path: /invalidate
      name: invalidatecachebytags
      operations:
      - method: POST
        name: invalidatecachebytags
        description: Prisma Invalidate cache entries by tags
        call: prisma.invalidatecachebytags
        outputParameters:
        - type: object
          mapping: $.
    - path: /invalidate-all
      name: invalidateallcache
      operations:
      - method: POST
        name: invalidateallcache
        description: Prisma Invalidate all cache entries
        call: prisma.invalidateallcache
        outputParameters:
        - type: object
          mapping: $.
    - path: /health
      name: gethealthstatus
      operations:
      - method: GET
        name: gethealthstatus
        description: Prisma Check Accelerate service health
        call: prisma.gethealthstatus
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: prisma-mcp
    transport: http
    description: MCP adapter for Prisma Accelerate API for AI agent use.
    tools:
    - name: executequery
      description: Prisma Execute a proxied database query
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: prisma.executequery
      with:
        apiVersion: tools.apiVersion
        engineHash: tools.engineHash
      inputParameters:
      - name: apiVersion
        type: string
        description: Prisma engine API version
        required: true
      - name: engineHash
        type: string
        description: Prisma engine version hash for protocol compatibility
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: invalidatecachebytags
      description: Prisma Invalidate cache entries by tags
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: prisma.invalidatecachebytags
      outputParameters:
      - type: object
        mapping: $.
    - name: invalidateallcache
      description: Prisma Invalidate all cache entries
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: prisma.invalidateallcache
      outputParameters:
      - type: object
        mapping: $.
    - name: gethealthstatus
      description: Prisma Check Accelerate service health
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: prisma.gethealthstatus
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    PRISMA_TOKEN: PRISMA_TOKEN
