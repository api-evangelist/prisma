  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.JSON_SCHEMA_VALIDATION_FAILED
- code: RUNTIME.MIDDLEWARE_FAMILY_MISMATCH
  namespace: RUNTIME
  meaning: 'A middleware registered on the runtime declares a `familyId` (e.g. `sql`) that differs from
