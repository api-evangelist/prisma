    is canonical: `migration plan --from <tip>` (catch the graph up), `ref set db <markerHash>` (fix a
    drifted local ref), or investigate out-of-band migration. Payload: `markerHash`, `reachableHashes`,
    `graphTip` '
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.MARKER_MISMATCH
- code: MIGRATION.MARKER_NOT_IN_HISTORY
  namespace: MIGRATION
  meaning: 'A warning diagnostic (not a hard failure) in `migration status`: the database''s marker hash
    does not match any migration in the history, meaning the database was updated outside the migration
    system. Hints suggest `db sign` (overwrite marker) or `db update` (push the contract).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.MARKER_NOT_IN_HISTORY
- code: MIGRATION.MARKER_ORIGIN_MISMATCH
  namespace: MIGRATION
  meaning: 'Runner-level failure during apply: the plan asserts an origin contract, but the database marker
    is missing, or its storage hash (or profile hash) differs from the plan''s origin — the database is
    not at the state the plan was computed from. Re-plan from the database''s actual state; `db init`
    intercepts this code to render an init-specific "already initialised at a different contract" message.
    Paylo'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.MARKER_ORIGIN_MISMATCH
- code: MIGRATION.MISSING_INVARIANTS
  namespace: MIGRATION
  meaning: 'A diagnostic in `migration status`: the active ref requires data invariants that the database
    marker does not record as provided. If no path through the graph can supply them, status escalates
    to `MIGRATION.NO_INVARIANT_PATH`. Payload: `ref` (when a ref is active), `invariants` (the missing
    ids).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.MISSING_INVARIANTS
- code: MIGRATION.NO_CHANGES
  namespace: MIGRATION
  meaning: '`migration new` found the from and to contract hashes identical — there is nothing to migrate.
    Change the contract and re-run `prisma contract emit` first, or pass `--from <hash>` explicitly to
    author a data-only migration on the current contract hash. Payload: none.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.NO_CHANGES
- code: MIGRATION.NO_INITIAL_MIGRATION
  namespace: MIGRATION
  meaning: 'While reconstructing the migration graph, no migration starts from the empty contract state,
    so the history has no entry point. Usually indicates corrupted `migration.json` files. Payload: `nodes`
    (known hashes).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.NO_INITIAL_MIGRATION
- code: MIGRATION.NO_INVARIANT_PATH
  namespace: MIGRATION
  meaning: 'The target (or named ref) requires data invariants, and no path through the migration graph
    from the current state covers all of them. Add a migration on the path that runs a `dataTransform`
    with each missing `invariantId`, or retarget the ref. Payload: `required`, `missing`, `structuralPath`
    (edges: `dirName`, `migrationHash`, `from`, `to`, `invariants`), `refName` (when applicable). Also
    raised '
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.NO_INVARIANT_PATH
- code: MIGRATION.NO_MIGRATIONS
  namespace: MIGRATION
  meaning: '`migration show` was given a non-path reference but the app space has no migration packages
    at all, so there is nothing to resolve against. Create a migration with `prisma migration plan` first.
    Payload: none.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.NO_MIGRATIONS
- code: MIGRATION.NO_TARGET
  namespace: MIGRATION
  meaning: 'The migration history contains cycles (e.g. after a rollback migration C1→C2→C1) and no target
    can be resolved automatically. Pass `--from <hash>` to specify the planning origin explicitly. Payload:
    `reachableHashes`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.NO_TARGET
- code: MIGRATION.OPERATION_UNSUPPORTED
  namespace: MIGRATION
  meaning: 'A Mongo migration check uses a filter feature the check evaluator does not support — an unsupported
    filter operator, or an aggregation-expression filter. Payload: `operator`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.OPERATION_UNSUPPORTED
- code: MIGRATION.PACKAGE_NOT_FOUND
  namespace: MIGRATION
  meaning: '`migration show` or `migration check` resolved its target (a directory path, or a migration
    reference) but no loaded on-disk migration package matches it — either no package lives at the given
    path, or the resolved migration''s package failed to load. `migration check` raises it at exit `2`:
    it could not run the check at all, which is different from running it and finding something. Pass
    a director'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.PACKAGE_NOT_FOUND
- code: MIGRATION.PATH_UNREACHABLE
  namespace: MIGRATION
  meaning: 'An apply command (`migrate`/`db update`) cannot find a path through the on-disk migration
    graph from the database''s current marker to the requested target — the connecting edge was never
    planned. The fix walks you through `migration plan` (with the right `--from`/`--to`) then `migrate`.
    Payload: carries the underlying failure''s meta (`fromHash`, `targetHash`, `deadEnds`, `kind`).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.PATH_UNREACHABLE
- code: MIGRATION.PLANNING_FAILED
  namespace: MIGRATION
  meaning: 'Migration planning (typically during `db init`/`db update`) failed because of conflicts, e.g.
    the live database already contains objects that clash with the plan. The envelope aggregates each
    conflict''s summary and suggested fix. Payload: `conflicts`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.PLANNING_FAILED
- code: MIGRATION.PLAN_NOT_ARRAY
  namespace: MIGRATION
  meaning: 'An authored migration''s `operations` getter returned something other than an array. Fix the
    migration class so `operations` returns an array of operations. Payload: `dir`, `actualValue` (when
    known).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.PLAN_NOT_ARRAY
- code: MIGRATION.PLAN_ORIGIN_UNKNOWN
  namespace: MIGRATION
  meaning: '`migration plan` was run without `--from` and without a `db` ref while migrations already
    exist on disk. Planning would silently fall back to an empty-database origin and produce a migration
    that recreates everything the existing history already creates, so the command refuses. Set the `db`
    ref (`migration ref set db <contract>` or `db update`), pass `--from <contract>`, or pass `--from
    @empty` to'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.PLAN_ORIGIN_UNKNOWN
- code: MIGRATION.POLICY_VIOLATION
  namespace: MIGRATION
  meaning: 'A planned operation''s class (e.g. `destructive`) is not allowed by the execution-time operation
    policy in force for the command. Runner-level failure during apply. Payload: `operationId`, `operationClass`,
    `allowedClasses`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.POLICY_VIOLATION
- code: MIGRATION.POSTCHECK_FAILED
  namespace: MIGRATION
  meaning: 'After executing a migration operation, one of its postcheck steps (a query expected to return
    true) did not hold, so the apply is rolled back. Payload: `operationId`, `phase`, `stepDescription`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.POSTCHECK_FAILED
- code: MIGRATION.POSTGRES_CONTROL_STACK_MISSING
  namespace: MIGRATION
  meaning: 'A `PostgresMigration` operation (e.g. `createTable`, `dataTransform`) was invoked on an instance
    constructed without a control stack — normal CLI-driven runs always assemble one from `prisma.config.ts`,
    so this indicates a test fixture or ad-hoc consumer used the no-arg constructor (valid only for introspection).
    Payload: `operation`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.POSTGRES_CONTROL_STACK_MISSING
- code: MIGRATION.PRECHECK_FAILED
  namespace: MIGRATION
  meaning: 'Before executing a migration operation, one of its precheck steps (a query expected to return
    true) did not hold — the database is not in the state the operation requires — so the apply stops
    and rolls back. Payload: `operationId`, `phase`, `stepDescription`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.PRECHECK_FAILED
- code: MIGRATION.PROVIDED_INVARIANTS_MISMATCH
  namespace: MIGRATION
  meaning: 'The `providedInvariants` stored in `migration.json` disagrees with the canonical value derived
    from `ops.json` — the manifest was likely hand-edited without re-emitting (a same-ids-different-order
    case is called out explicitly). Re-emit the package. Payload: `filePath`, `stored`, `derived`, `difference`
    (`{missing, extra}`).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.PROVIDED_INVARIANTS_MISMATCH
- code: MIGRATION.REF_AMBIGUOUS
  namespace: MIGRATION
  meaning: 'A contract or migration reference prefix matches more than one candidate (raised by the shared
    ref-resolution mapper used across CLI commands). Provide a longer prefix or the full hash. Payload:
    `input`, `candidates`, `grammar`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.REF_AMBIGUOUS
- code: MIGRATION.REF_INVALID_FORMAT
  namespace: MIGRATION
  meaning: 'A contract or migration reference is syntactically invalid — it is not a hash, ref name, or
    migration directory name in any accepted form (raised by the shared ref-resolution mapper). Payload:
    `input`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.REF_INVALID_FORMAT
- code: MIGRATION.REF_NOT_FOUND
  namespace: MIGRATION
  meaning: 'A contract or migration reference does not resolve: no matching hash, ref name, or migration
    directory name exists in the migration graph or refs index (raised by the shared ref-resolution mapper
    used across CLI commands). Payload: `input`, `grammar`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.REF_NOT_FOUND
- code: MIGRATION.REF_NOT_RESOLVABLE
  namespace: MIGRATION
  meaning: 'A ref name resolves to nothing: no pointer file with that name exists, and the fallback hash
    is not a node in the migration graph either, so there is no contract to materialize. Create the ref
    with `ref set`, advance it via `db update --advance-ref`, or pass a graph-node hash. Payload: `refName`,
    `identifier`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.REF_NOT_RESOLVABLE
- code: MIGRATION.REF_SET_BUNDLE_NOT_FOUND
  namespace: MIGRATION
  meaning: '`ref set` resolved the given hash to a graph node, but no on-disk migration bundle has that
    hash as its destination, so the ref would point at a node with no backing package. Re-emit the migration
    that produces this hash. Payload: `hash`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.REF_SET_BUNDLE_NOT_FOUND
- code: MIGRATION.REF_SET_EMPTY_SENTINEL
  namespace: MIGRATION
  meaning: '`ref set` was asked to point a ref at the empty-database sentinel hash, which is a planner
    internal and not a valid ref target. Use a real contract hash from the migration graph. Payload: `hash`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.REF_SET_EMPTY_SENTINEL
- code: MIGRATION.REF_WRONG_GRAMMAR
  namespace: MIGRATION
  meaning: 'A reference parsed, but as the wrong kind for the argument position — e.g. a migration-only
    reference where a contract reference is required (raised by the shared ref-resolution mapper). The
    message and fix come from the resolver''s own diagnosis. Payload: `input`, `expectedGrammar`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.REF_WRONG_GRAMMAR
- code: MIGRATION.RUNNER_FAILED
  namespace: MIGRATION
  meaning: Generic wrapper for a migration runner failure during execution that has no more specific code;
    the summary/why carry the underlying detail (also used to surface the legacy-marker-shape condition
    from marker reads, with `meta.runnerErrorCode`). `migrate` and `db init` map unrecognized apply failures
    through it, passing the failure's own meta through unchanged. Inspect the reported summary/why deta
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.RUNNER_FAILED
- code: MIGRATION.SAME_SOURCE_AND_TARGET
  namespace: MIGRATION
  meaning: 'A migration''s `from` and `to` hashes are identical and it declares no data-transform operations
    — a pure no-op self-edge, which is only allowed when the migration runs at least one `dataTransform`.
    Change the contract, add a dataTransform, or delete the migration. Payload: `dirName`, `hash`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.SAME_SOURCE_AND_TARGET
- code: MIGRATION.SCHEMA_VERIFY_FAILED
  namespace: MIGRATION
  meaning: 'After applying migrations, the runner introspected the database and the resulting schema does
    not satisfy the destination contract; the apply is rolled back. Runner-level failure during `db init`/`db
    update`/`migrate`. Payload: `issues` (schema diff issues).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.SCHEMA_VERIFY_FAILED
- code: MIGRATION.SNAPSHOT_MISSING
  namespace: MIGRATION
  meaning: 'A `--from` reference cannot produce a contract: either a ref name has no pointer file and
    the fallback hash is not a graph node (`viaRef: true`), or an explicit `--from <hash>` was given on
    an empty migration graph and names no ref (`viaRef: false`). Payload: `identifier`, `viaRef`. Also
    raised by `db sign` when a contract reference resolves to a hash but no migration produces that hash
    and the em'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.SNAPSHOT_MISSING
- code: MIGRATION.SPACE_NOT_FOUND
  namespace: MIGRATION
  meaning: '`migration list --space <id>` (and similar space-scoped commands) named a contract space with
    no directory under `migrations/`. Distinct from an existing-but-empty space, which renders an empty
    state and exits 0. The envelope lists the space directories that do exist. Payload: `spaceId`, `availableSpaces`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.SPACE_NOT_FOUND
- code: MIGRATION.SQLITE_CONTROL_STACK_MISSING
  namespace: MIGRATION
  meaning: 'SQLite twin of `MIGRATION.POSTGRES_CONTROL_STACK_MISSING`: a `SqliteMigration` operation needing
    the control adapter was invoked on an instance constructed without a control stack (only introspection
    is valid in that form). Payload: `operation`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.SQLITE_CONTROL_STACK_MISSING
- code: MIGRATION.TABLE_NAME_CASE_CHANGED
  namespace: MIGRATION
  meaning: The planner would drop table `X` and create table `Y` in the same namespace, where `X` is `Y`
    with its first letter lowered; the columns are not compared. That is the shape of a schema upgraded
    across the release in which a model with no `@@map` stopped lowering the first letter of its table
    name (`model UserProfile` now names `"UserProfile"`, previously `"userProfile"`); planning it would
    recreat
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.TABLE_NAME_CASE_CHANGED
- code: MIGRATION.TARGET_MISMATCH
  namespace: MIGRATION
  meaning: 'A migration script declares one `targetId` but the loaded `prisma.config.ts` declares another;
    the script can only run against a config targeting the same database. Switch configs or pass `--config
    <path>`. Payload: `migrationTargetId`, `configTargetId`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.TARGET_MISMATCH
- code: MIGRATION.TARGET_NOT_APP_SPACE
  namespace: MIGRATION
  meaning: 'A filesystem-path target given to a migration command does not resolve to an app-space migration
    directory — it points outside the app space''s migrations directory, or at that directory''s root
    itself. Pass an app-space migration directory or use a hash prefix. Payload: none.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.TARGET_NOT_APP_SPACE
- code: MIGRATION.TARGET_UNSUPPORTED
  namespace: MIGRATION
  meaning: The configured target does not provide migration support (no planner/runner via `target.migrations`),
    so migration commands like `db init` cannot run against it. Select a target that provides migrations.
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.TARGET_UNSUPPORTED
- code: MIGRATION.UNFILLED_PLACEHOLDER
  namespace: MIGRATION
  meaning: 'A scaffolded migration still contains a `placeholder(...)` call that the author never replaced
    with a real query; it throws when the migration is emitted or run. The `slot` names the exact location
    to edit (e.g. `"backfill-product-status:check.source"`). Payload: `slot`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.UNFILLED_PLACEHOLDER
- code: MIGRATION.UNKNOWN_INVARIANT
  namespace: MIGRATION
  meaning: 'A ref declares required invariants that no migration anywhere in the graph provides — either
    the ref has a typo or the providing migration has not been authored yet. Payload: `unknown`, `declared`,
    `refName` (when applicable).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.UNKNOWN_INVARIANT
- code: MIGRATION.UNKNOWN_REF
  namespace: MIGRATION
  meaning: 'A ref name was used (read, resolved, or deleted via `ref` commands) but no ref file with that
    name exists. Create it with `prisma ref set <name> <hash>`, or run `ref list` to see what exists.
    Payload: `refName`, `filePath` or `availableRefs` depending on the site.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#MIGRATION.UNKNOWN_REF
- code: PLAN.HASH_MISMATCH
  namespace: PLAN
  meaning: 'At execute time, the plan''s `meta.storageHash` does not match the runtime contract''s storage
    hash — the plan was built against a different version of the contract than the one the runtime holds.
    Rebuild the plan against the current contract. Payload: `planStorageHash`, `runtimeStorageHash`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#PLAN.HASH_MISMATCH
- code: PLAN.TARGET_MISMATCH
  namespace: PLAN
  meaning: 'At execute time, the plan''s `meta.target` does not match the runtime contract''s target —
    e.g. a plan built for postgres submitted to a sqlite runtime. Payload: `planTarget`, `runtimeTarget`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#PLAN.TARGET_MISMATCH
- code: BUDGET.ROWS_EXCEEDED
  namespace: BUDGET
  meaning: 'The `budgets` middleware blocks (or warns about) a query expected or observed to return more
    rows than the configured `maxRows` budget. Thrown before execution for an unbounded SELECT (no LIMIT,
    no aggregate-without-GROUP-BY) or when the AST-based row estimate exceeds the budget, and during row
    streaming when the observed row count crosses `maxRows`; raw-SQL guardrails also emit it for raw SELECT '
  docs: https://www.prisma.io/docs/orm/reference/error-reference#BUDGET.ROWS_EXCEEDED
- code: BUDGET.TIME_EXCEEDED
  namespace: BUDGET
  meaning: 'The `budgets` middleware reports after execution that a query''s latency exceeded the configured
    `maxLatencyMs` budget. Default severity is warn (logged); it throws when the latency severity is configured
    as `error` or the runtime runs in strict mode. Payload: `latencyMs`, `maxLatencyMs`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#BUDGET.TIME_EXCEEDED
- code: LINT.DELETE_WITHOUT_WHERE
  namespace: LINT
  meaning: 'The `lints` middleware found a DELETE plan with no WHERE clause and blocks execution to prevent
    an accidental full-table deletion. Default severity is error (throws); configurable to warn. Payload:
    `table`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#LINT.DELETE_WITHOUT_WHERE
- code: LINT.NO_LIMIT
  namespace: LINT
  meaning: 'The `lints` middleware (or raw-SQL guardrails) found a SELECT with no LIMIT, which may return
    an unboundedly large result set. Default severity is warn (logged, execution proceeds); raw-SQL plans
    are checked heuristically against the SQL text. Payload: `table` (AST path) or `sql` snippet (raw
    path).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#LINT.NO_LIMIT
- code: LINT.READ_ONLY_MUTATION
  namespace: LINT
  meaning: 'Raw-SQL guardrails found a mutating statement (INSERT/UPDATE/DELETE/DDL) in a plan whose meta
    annotations declare a read-only intent (`read`, `report`, or `readonly`). Default severity is error
    (throws). Payload: `sql`, `intent`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#LINT.READ_ONLY_MUTATION
- code: LINT.SELECT_STAR
  namespace: LINT
  meaning: 'The `lints` middleware found a query that selects all columns — via the builder''s selectAll
    intent on AST plans, or a literal `SELECT *` in raw SQL. Default severity is warn on the AST path,
    error on the raw path. Payload: `table` (AST path) or `sql` snippet (raw path).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#LINT.SELECT_STAR
- code: LINT.UPDATE_WITHOUT_WHERE
  namespace: LINT
  meaning: 'The `lints` middleware found an UPDATE plan with no WHERE clause and blocks execution to prevent
    an accidental full-table update. Default severity is error (throws); configurable to warn. Payload:
    `table`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#LINT.UPDATE_WITHOUT_WHERE
- code: PARADEDB.ARGUMENT_INVALID
  namespace: PARADEDB
  meaning: 'A ParadeDB search-function helper received an invalid argument — a malformed query object,
    an out-of-range numeric option, or an option combination the function does not accept. Raised while
    authoring/lowering the search expression. Payload: `helper`, `argument`, `received`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#PARADEDB.ARGUMENT_INVALID
- code: POSTGIS.GEOMETRY_INVALID
  namespace: POSTGIS
  meaning: 'A PostGIS geometry constructor (`point`, `polygon`, `bboxPolygon`, …) received invalid input:
    non-finite coordinates, a ring that is not closed, too few points, or a malformed bounding box. Raised
    at construction time, before the value reaches the database. Payload: `constructor`, `received`, `reason`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#POSTGIS.GEOMETRY_INVALID
- code: SUPABASE.CONFIG_INVALID
  namespace: SUPABASE
  meaning: 'The Supabase extension''s runtime configuration is invalid — missing or contradictory connection/auth
    settings (formerly the `SupabaseConfigError` class, removed at 0.17). Payload: `reason`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#SUPABASE.CONFIG_INVALID
- code: SUPABASE.JWT_INVALID
  namespace: SUPABASE
  meaning: 'A JWT handed to the Supabase runtime failed validation — malformed token, missing claims,
    or signature/JWKS mismatch (formerly the `InvalidJwtError` class, removed at 0.17). Payload: `reason`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#SUPABASE.JWT_INVALID
- code: TESTKIT.CODEC_DESCRIPTOR_MISSING
  namespace: TESTKIT
  meaning: 'A conformance case names a codec id the target''s built-in descriptor registry does not know,
    and the case supplies no descriptor of its own. The harness projects and decodes through the codec
    descriptor under test, so an extension codec must be supplied on the case. Payload: `codecId`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#TESTKIT.CODEC_DESCRIPTOR_MISSING
- code: TESTKIT.CONFORMANCE_CASE_INVALID
  namespace: TESTKIT
  meaning: A `many` conformance case carries a value that is neither an array nor null — the harness maps
    element-wise over array cases and has nothing to map over. Give the case an array of element values,
    or null.
  docs: https://www.prisma.io/docs/orm/reference/error-reference#TESTKIT.CONFORMANCE_CASE_INVALID
- code: TESTKIT.PROJECTION_MALFORMED
  namespace: TESTKIT
  meaning: 'The executed JSON projection came back in a shape the codec descriptor does not declare: the
    projected document is missing its value key, or an array projection produced something other than
    a JSON array or null. This points at the projection SQL the descriptor under test renders. Payload:
    `codecId` (when the case is known).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#TESTKIT.PROJECTION_MALFORMED
