  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.AST_INVALID
- code: RUNTIME.AST_UNSUPPORTED
  namespace: RUNTIME
  meaning: 'The authored SQL AST uses a feature this target cannot render — e.g. DEFAULT as a value in
    INSERT … VALUES, WITH ORDINALITY on function sources, or returned-column aliases on function sources,
    all on SQLite. Raised by the target adapters'' renderers. Payload: `node` (INSERT DEFAULT site); `target`,
    `feature` (function-source sites).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.AST_UNSUPPORTED
- code: RUNTIME.BINDING_INVALID
  namespace: RUNTIME
  meaning: 'A target facade client (`@prisma/orm-postgres`, `@prisma/orm-sqlite`, `@prisma/orm-mongo`)
    received a connection binding whose shape is wrong for the target — malformed connection string, unsupported
    binding kind, or missing required fields. Raised at `connect(...)` / client construction. Payload:
    `received`, `reason`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.BINDING_INVALID
- code: RUNTIME.BINDING_MISSING
  namespace: RUNTIME
  meaning: 'A target facade client was asked to connect with no binding at all (no connection string,
    no environment fallback). Payload: `expected`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.BINDING_MISSING
- code: RUNTIME.CODEC_DESCRIPTOR_ARRAY_UNSUPPORTED
  namespace: RUNTIME
  meaning: 'A codec projection used `CodecRef.many` against a SQLite codec descriptor — SQLite has no
    stored scalar-array codec protocol, so projecting the whole stored array would be ambiguous. Use a
    scalar CodecRef or an explicit target representation. Payload: `codecId`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.CODEC_DESCRIPTOR_ARRAY_UNSUPPORTED
- code: RUNTIME.CODEC_DESCRIPTOR_INVALID
  namespace: RUNTIME
  meaning: 'A codec descriptor handed to a target codec-descriptor registry (Postgres, SQLite) is not
    a valid descriptor for that target: wrong discriminant, missing target descriptor methods, or a malformed
    params schema. Extend the target''s descriptor class or adapt a generic descriptor with the target''s
    wrapper (`postgresCodec()` / `sqliteCodec()`). Payload: `codecId`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.CODEC_DESCRIPTOR_INVALID
- code: RUNTIME.CODEC_DESCRIPTOR_MISSING
  namespace: RUNTIME
  meaning: 'A column (or AST-carried CodecRef) references a `codecId` for which no runtime component registered
    a codec descriptor — usually the extension pack that owns the codec is missing from the runtime stack.
    Surfaces at SQL context construction during the contract codec walk, or lazily when the AST codec
    resolver materializes a codec at query time. Payload: `codecId`; on the column path also `table`,
    `'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.CODEC_DESCRIPTOR_MISSING
- code: RUNTIME.CODEC_MISSING
  namespace: RUNTIME
  meaning: 'Runtime validation of the contract found columns whose `codecId` has no implementation in
    the codec registry; the error lists every affected column. Surfaces when the codec registry''s completeness
    is validated at context/runtime setup. Payload: `contractTarget`, `invalidCodecs` (list of `{ namespaceId,
    table, column, codecId }`).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.CODEC_MISSING
- code: RUNTIME.CODEC_PARAMETERIZATION_MISMATCH
  namespace: RUNTIME
  meaning: 'A column''s codec reference disagrees with the codec''s parameterization: a parameterized
    codec is used with no `typeParams` (and its schema requires some), or `typeParams` are supplied to
    a non-parameterized codec. Surfaces during the SQL context''s contract codec walk. Payload: `table`,
    `column`, `codecId`, `expected`, `actual`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.CODEC_PARAMETERIZATION_MISMATCH
- code: RUNTIME.CONTENT_HASH_REQUIRES_RESOLVED_COMMAND
  namespace: RUNTIME
  meaning: 'Mongo middleware called `ctx.contentHash(plan)` (or `computeMongoContentHash`) during `beforeExecute`,
    when `plan.command` is still an unresolved lowered draft rather than a resolved wire command. Compute
    the hash from `afterExecute`, or use the param mutator instead of reading `plan.command` structurally.
    Payload: `phase`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.CONTENT_HASH_REQUIRES_RESOLVED_COMMAND
- code: RUNTIME.CONTRACT_FAMILY_MISMATCH
  namespace: RUNTIME
  meaning: 'At SQL context construction, the contract''s target family (e.g. `mongo`) does not match the
    runtime stack''s family (`sql`) — the contract was emitted for a different database family than the
    stack being assembled. Payload: `actual`, `expected`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.CONTRACT_FAMILY_MISMATCH
- code: RUNTIME.CONTRACT_TARGET_MISMATCH
  namespace: RUNTIME
  meaning: 'At SQL context construction, the contract''s target (e.g. `sqlite`) does not match the runtime
    stack''s target descriptor (e.g. `postgres`) — the contract and the adapter/driver stack disagree
    about the database target. Payload: `actual`, `expected`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.CONTRACT_TARGET_MISMATCH
- code: RUNTIME.DDL_UNSUPPORTED
  namespace: RUNTIME
  meaning: '`lower()` was asked to lower DDL on a surface that cannot do it: the runtime adapter (DDL
    lowering is a control-plane concern), or the synchronous control lowering path (DDL default literals
    require async codec encoding — use `lowerToExecuteRequest()`). Raised by the Postgres and SQLite adapters.
    Payload: `surface`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.DDL_UNSUPPORTED
- code: RUNTIME.DECODE_FAILED
  namespace: RUNTIME
  meaning: 'A codec''s `decode` threw while converting a wire value into its output type during result
    decoding — surfaces per column (SQL), per document field (Mongo), or per included-relation column
    (ORM client), with the original error attached as `cause`. Also thrown when a returned row is missing
    an expected projection alias, or when the JSON array for an include alias fails to parse. Payload:
    `table`, `c'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.DECODE_FAILED
- code: RUNTIME.DUPLICATE_AGGREGATE_DESCRIPTOR
  namespace: RUNTIME
  meaning: 'Two components claim the same aggregate overload — the same `(operation, input)` pair, keyed
    as `sum:trait:numeric`, `sum:codec:pg/int8@1`, or `count:none`. Each overload resolves to exactly
    one result codec, so exactly one target, adapter, or extension may contribute it. Payload: `key`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.DUPLICATE_AGGREGATE_DESCRIPTOR
- code: RUNTIME.DUPLICATE_AUTHORING_DISCRIMINATOR
  namespace: RUNTIME
  meaning: 'Two authoring contributions register the same discriminator key — the same `entityType` key
    or the same `pslBlock` parser keyword — when the framework authoring surface assembles its descriptor
    registry. Each contribution must use a unique key. Payload: `label`, `key`, `existingPath`, `path`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.DUPLICATE_AUTHORING_DISCRIMINATOR
- code: RUNTIME.DUPLICATE_CODEC
  namespace: RUNTIME
  meaning: 'Two runtime stack contributors (target pack, extension packs) register a codec with the same
    id — while the SQL context or Mongo execution stack collects codecs, or while a target codec-descriptor
    registry (Postgres, SQLite) is composed. Remove the duplicate contribution. Payload: `codecId`; on
    the Mongo path also `existingOwner`, `incomingOwner`; on the target registry path also `target`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.DUPLICATE_CODEC
- code: RUNTIME.DUPLICATE_MUTATION_DEFAULT_GENERATOR
  namespace: RUNTIME
  meaning: 'Two runtime stack contributors register a mutation default generator with the same id while
    the SQL context collects them. Payload: `id`, `existingOwner`, `incomingOwner`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.DUPLICATE_MUTATION_DEFAULT_GENERATOR
- code: RUNTIME.ENCODE_FAILED
  namespace: RUNTIME
  meaning: 'A codec''s `encode` threw while converting a user-supplied parameter value to driver wire
    format during query execution (SQL param encoding, or Mongo param-ref resolution), with the original
    error attached as `cause`. Payload: `label`, `codec`; SQL path also `paramIndex`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.ENCODE_FAILED
- code: RUNTIME.EXECUTION_RESULT_MISSING
  namespace: RUNTIME
  meaning: 'A statistics execution completed without returning statement statistics. This indicates a
    runtime or middleware implementation violated the execution contract instead of returning `{ affectedRows
    }`. Payload: none.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.EXECUTION_RESULT_MISSING
- code: RUNTIME.ITERATOR_CONSUMED
  namespace: RUNTIME
  meaning: 'An `AsyncIterableResult` (the return value of `query()`) was iterated a second time — each
    result can be consumed only once, whether via a `for await` loop or via `toArray()`/`await`. Store
    the array from `toArray()` if you need to reuse the rows. Payload: `consumedBy`, `suggestion`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.ITERATOR_CONSUMED
- code: RUNTIME.JSON_SCHEMA_VALIDATION_FAILED
  namespace: RUNTIME
  meaning: 'The `arktype-json` codec rejected a JSON value that does not satisfy the column''s arktype
    schema, on encode (writing) or decode (reading). Also thrown when the schema itself cannot be rehydrated
