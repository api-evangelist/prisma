name: Prisma
description: Prisma gives TypeScript and Node.js teams a type-safe ORM, managed serverless Postgres, and Compute
  for deploying apps and AI agents next to their database. The product line is Prisma ORM, Prisma Postgres, Prisma
  Compute, Prisma Composer, Prisma Studio, Object Store buckets and Query Insights, wired together by one CLI, a
  REST Management API at api.prisma.io/v1, and a hosted MCP server at mcp.prisma.io. Accelerate, Pulse and Optimize
  have left the advertised line.
