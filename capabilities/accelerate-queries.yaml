naftiko: 1.0.0-alpha2
info:
  label: Prisma Accelerate API — Queries
  description: 'Prisma Accelerate API — Queries. 1 operations. Lead operation: Prisma Execute a proxied database query. Self-contained
    Naftiko capability covering one Prisma business surface.'
  tags:
  - Prisma
  - Queries
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PRISMA_API_KEY: PRISMA_API_KEY
capability:
  consumes:
  - type: http
    namespace: accelerate-queries
    baseUri: https://accelerate.prisma-data.net
    description: Prisma Accelerate API — Queries business capability. Self-contained, no shared references.
    resources:
    - name: apiVersion-engineHash-graphql
      path: /{apiVersion}/{engineHash}/graphql
      operations:
      - name: executequery
        method: POST
        description: Prisma Execute a proxied database query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: apiVersion
          in: path
          type: string
          description: Prisma engine API version
          required: true
        - name: engineHash
          in: path
          type: string
          description: Prisma engine version hash for protocol compatibility
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.PRISMA_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: accelerate-queries-rest
    port: 8080
    description: REST adapter for Prisma Accelerate API — Queries. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/{apiversion}/{enginehash}/graphql
      name: apiversion-enginehash-graphql
      description: REST surface for apiVersion-engineHash-graphql.
      operations:
      - method: POST
        name: executequery
        description: Prisma Execute a proxied database query
        call: accelerate-queries.executequery
        with:
          apiVersion: rest.apiVersion
          engineHash: rest.engineHash
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: accelerate-queries-mcp
    port: 9090
    transport: http
    description: MCP adapter for Prisma Accelerate API — Queries. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: prisma-execute-proxied-database-query
      description: Prisma Execute a proxied database query
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: accelerate-queries.executequery
      with:
        apiVersion: tools.apiVersion
        engineHash: tools.engineHash
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
