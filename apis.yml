- aid: prisma:prisma-postgres-management-api
  name: Prisma Postgres Management API
  description: The provider-published REST control plane for Prisma. 115 operations across 72 paths covering workspaces,
    projects, Prisma Postgres databases, connection strings, backups, usage, object-store buckets and keys, service
    tokens, integrations and regions, plus the Prisma Compute surface (apps, services, deployments, branches, builds,
    domains, environment variables and source repositories) marked experimental in the contract itself. Authenticated
    with a never-expiring service token or OAuth 2.0 + PKCE against auth.prisma.io.
  humanURL: https://www.prisma.io/docs/rest-api
  baseURL: https://api.prisma.io/v1
