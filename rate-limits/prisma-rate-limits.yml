tags:
  - Database
  - ORM
  - Postgres
  - Rate Limiting
description: Prisma Data Platform (Postgres + Accelerate) does not publish a per-second rate-limit table.
  The documented quantitative bounds are response-size and connection-related — Accelerate flags retrievals
  over 5 MB as significantly slowing the application (error P6009), and the default Postgres connection
  limit is 10 unless `connection_limit` is configured. Plan-level monthly operation quotas (free / starter
  / pro / business) effectively serve as the consumer-facing rate ceilings.
notes: Prisma's public docs do not give per-second numbers; the controllable limits are plan-quota operations,
  the 5 MB response-size threshold (P6009), and the connection_limit setting on the database URL.
sources:
  - https://www.prisma.io/docs/accelerate/limitations
  - https://www.prisma.io/docs/postgres/database/api-reference
responseCodes:
  throttled: 429
limits:
  - name: Plan monthly operations (Postgres + Accelerate)
    scope: account
    metric: operations
    limit: 'plan-defined (Free 100k Postgres / 60k Accelerate; Starter 1M Postgres; Pro 10M Postgres;
      Business 50M Postgres)'
    timeFrame: month
    notes: Once a plan's included operations are consumed, additional operations bill at the plan's
      per-1,000 overage rate rather than being throttled.
  - name: Accelerate response size
    scope: query
    metric: varies
    limit: '5 MB recommended ceiling per response (P6009 P6009 — slows app significantly above this)'
    notes: Accelerate documentation flags retrievals over 5 MB as the practical response-size bound;
      query timeout is also configured but the exact value is not published.
  - name: Postgres connection limit
    scope: database
    metric: concurrent_requests
    limit: '10 (default)'
    notes: Set by the `connection_limit` parameter on the database URL; raise based on workload and
      plan capacity.
policies:
  - name: Plan-Quota Throttling
    description: Hard request throttling is not the primary lever — plan-level monthly operation quotas
      cap usage, with overage billed at the plan's per-1,000 rate.
  - name: Connection Pooling via Accelerate
    description: Use Prisma Accelerate's connection-pooling and edge cache to reduce direct Postgres
      connections; cache tags (Pro/Business) let consumers invalidate specific cached queries.
  - name: Response-Size Discipline
    description: Keep individual query responses under ~5 MB; paginate large result sets to avoid the
      P6009 slowdown.
