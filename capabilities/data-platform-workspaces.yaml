naftiko: 1.0.0-alpha2
info:
  label: Prisma Data Platform API — Workspaces
  description: 'Prisma Data Platform API — Workspaces. 3 operations. Lead operation: Prisma List all workspaces. Self-contained
    Naftiko capability covering one Prisma business surface.'
  tags:
  - Prisma
  - Workspaces
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PRISMA_API_KEY: PRISMA_API_KEY
capability:
  consumes:
  - type: http
    namespace: data-platform-workspaces
    baseUri: https://api.cloud.prisma.io
    description: Prisma Data Platform API — Workspaces business capability. Self-contained, no shared references.
    resources:
    - name: workspaces
      path: /workspaces
      operations:
      - name: listworkspaces
        method: GET
        description: Prisma List all workspaces
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: workspaces-workspaceId
      path: /workspaces/{workspaceId}
      operations:
      - name: getworkspace
        method: GET
        description: Prisma Get a workspace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateworkspace
        method: PATCH
        description: Prisma Update a workspace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.PRISMA_API_KEY}}'
  exposes:
  - type: rest
    namespace: data-platform-workspaces-rest
    port: 8080
    description: REST adapter for Prisma Data Platform API — Workspaces. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/workspaces
      name: workspaces
      description: REST surface for workspaces.
      operations:
      - method: GET
        name: listworkspaces
        description: Prisma List all workspaces
        call: data-platform-workspaces.listworkspaces
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/workspaces/{workspaceid}
      name: workspaces-workspaceid
      description: REST surface for workspaces-workspaceId.
      operations:
      - method: GET
        name: getworkspace
        description: Prisma Get a workspace
        call: data-platform-workspaces.getworkspace
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateworkspace
        description: Prisma Update a workspace
        call: data-platform-workspaces.updateworkspace
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: data-platform-workspaces-mcp
    port: 9090
    transport: http
    description: MCP adapter for Prisma Data Platform API — Workspaces. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: prisma-list-all-workspaces
      description: Prisma List all workspaces
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: data-platform-workspaces.listworkspaces
      outputParameters:
      - type: object
        mapping: $.
    - name: prisma-get-workspace
      description: Prisma Get a workspace
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: data-platform-workspaces.getworkspace
      outputParameters:
      - type: object
        mapping: $.
    - name: prisma-update-workspace
      description: Prisma Update a workspace
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: data-platform-workspaces.updateworkspace
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
