  - deleteV1WorkspacesByWorkspaceIdService-tokensByServiceTokenId
  note: The docs warn explicitly that service tokens NEVER EXPIRE and a leaked token stays valid until
    revoked. The token value is returned exactly once at creation and is never stored, so a caller that
    loses it must mint a new one.
