    list. Payload: `middleware`, `targetId`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.MIDDLEWARE_INCOMPATIBLE
- code: RUNTIME.MIDDLEWARE_RESULT_MISMATCH
  namespace: RUNTIME
  meaning: 'Middleware returned a query result for a statistics operation, or statistics for a row query.
    Middleware interception results must carry the same `operation` discriminant as the operation they
    intercept. Payload: `expected`, `received`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.MIDDLEWARE_RESULT_MISMATCH
- code: RUNTIME.MIDDLEWARE_TARGET_MISMATCH
  namespace: RUNTIME
  meaning: 'A middleware declares a `targetId` (e.g. `postgres`) that differs from the runtime''s configured
    target. Checked when the runtime validates its middleware list. Payload: `middleware`, `middlewareTargetId`,
    `runtimeTargetId`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.MIDDLEWARE_TARGET_MISMATCH
- code: RUNTIME.MISSING_EXTENSION_PACK
  namespace: RUNTIME
  meaning: 'At SQL context construction, the contract requires one or more extension packs that no component
    in the runtime stack provides. Add the missing pack(s) to the stack. Payload: `packIds`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.MISSING_EXTENSION_PACK
- code: RUNTIME.MONGO_STATISTICS_RESULT_INVALID
  namespace: RUNTIME
  meaning: 'A Mongo update or delete command did not return exactly one result object with the required
    numeric native count field. Updates require `modifiedCount`; deletes require `deletedCount`. Payload:
    `commandKind`, `countField`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.MONGO_STATISTICS_RESULT_INVALID
- code: RUNTIME.MONGO_STATISTICS_UNSUPPORTED
  namespace: RUNTIME
  meaning: 'Statistics execution was requested for a Mongo command that does not expose affected-row statistics.
    Only update and delete command kinds provide the native counts used by this operation. Payload: `commandKind`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.MONGO_STATISTICS_UNSUPPORTED
- code: RUNTIME.MUTATION_DEFAULT_GENERATOR_MISSING
  namespace: RUNTIME
  meaning: 'The contract declares column defaults produced by a mutation default generator (e.g. a nanoid/uuid
    generator) that no runtime component provides — detected up front when the SQL context validates generator
    coverage, or at mutation time when a generator-kind default spec is resolved. Payload: `ids` (validation
    pass) or `id` (resolution).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.MUTATION_DEFAULT_GENERATOR_MISSING
- code: RUNTIME.NAMESPACE_UNKNOWN
  namespace: RUNTIME
  meaning: 'At query-render time a table references a namespace that is not present, or not materialised
    as a database schema, on the contract. Raised by the Postgres and SQLite SQL renderers. Payload: `table`,
    `namespaceId`, `reason`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.NAMESPACE_UNKNOWN
- code: RUNTIME.NO_ROWS
  namespace: RUNTIME
  meaning: '`firstOrThrow()` was called on a query result that returned no rows. Use `first()` if an empty
    result is acceptable.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.NO_ROWS
- code: RUNTIME.PARAM_REF_CODEC_REQUIRED
  namespace: RUNTIME
  meaning: While building a query expression, a plain JS value was passed where no codec could be derived
    — `toExpr` cannot construct a ParamRef for a bare value without an explicit `CodecRef`. Provide a
    codec at the call site or use a column-bound builder path.
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.PARAM_REF_CODEC_REQUIRED
- code: RUNTIME.PARAM_REF_MISSING_CODEC
  namespace: RUNTIME
  meaning: 'The Postgres SQL renderer reached lowering with a ParamRef that carries no bound `CodecRef`
    — an internal invariant of the AST-bound codec contract, usually indicating a builder path that constructed
    a ParamRef without threading the column codec. Payload: `paramIndex`, `name`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.PARAM_REF_MISSING_CODEC
- code: RUNTIME.PREPARE_BIND_ON_ADHOC
  namespace: RUNTIME
  meaning: 'An AST containing a prepared-statement bind-site reference (`PreparedParamRef`) was submitted
    to the ad-hoc `execute()` path. Bind-site references are only valid inside `runtime.prepare(...)`.
    Payload: `name`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.PREPARE_BIND_ON_ADHOC
- code: RUNTIME.PREPARE_MISSING_PARAM
  namespace: RUNTIME
  meaning: 'Executing a prepared statement without supplying a value for one of its declared parameters
    — the lookup fails rather than silently binding `undefined`. Payload: `name`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.PREPARE_MISSING_PARAM
- code: RUNTIME.PREPARE_UNUSED_PARAM
  namespace: RUNTIME
  meaning: '`runtime.prepare(declaration, callback)` found declared parameter names that the callback''s
    plan never references. Remove the unused declarations or reference them in the plan. Payload: `unused`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.PREPARE_UNUSED_PARAM
- code: RUNTIME.RAW_ROW_COLUMN_MISSING
  namespace: RUNTIME
  meaning: A whole-query raw statement returned a result that omits a column its row spec declares. The
    runtime never parses the SQL, so the spec is its only description of the result — a column the spec
    names and the statement does not return is a mismatch the caller has to resolve, by correcting the
    spec or the statement. Distinct from `RUNTIME.DECODE_FAILED`, which means a codec rejected a value
    the runti
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.RAW_ROW_COLUMN_MISSING
- code: RUNTIME.RAW_SQL_UNSUPPORTED_INTERPOLATION
  namespace: RUNTIME
  meaning: A raw-SQL tagged template interpolated a JS value whose type cannot be auto-inferred to a codec
    (anything other than number, bigint, string, boolean, or Uint8Array). Wrap the value in `param(...)`
    with an explicit codec.
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.RAW_SQL_UNSUPPORTED_INTERPOLATION
- code: RUNTIME.TEMPORAL_UNAVAILABLE
  namespace: RUNTIME
  meaning: 'A value that only a global `Temporal` implementation can produce or read was needed in a runtime
    that has none. Two paths raise it, and they carry different metadata:'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.TEMPORAL_UNAVAILABLE
- code: RUNTIME.TRANSACTION_CLOSED
  namespace: RUNTIME
  meaning: A query result created inside a transaction was read after the transaction ended. Await the
    result or call `.toArray()` inside the transaction callback.
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.TRANSACTION_CLOSED
- code: RUNTIME.TRANSACTION_COMMIT_FAILED
  namespace: RUNTIME
  meaning: 'Committing a transaction failed; the runtime attempts a cleanup rollback and destroys the
    connection if that also fails. The driver''s commit error is attached as `cause`. Payload: `commitError`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.TRANSACTION_COMMIT_FAILED
- code: RUNTIME.TRANSACTION_ROLLBACK_FAILED
  namespace: RUNTIME
  meaning: 'Rolling back a transaction after the callback threw itself failed; the connection is destroyed
    rather than returned to the pool. The original callback error is attached as `cause`. Payload: `rollbackError`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.TRANSACTION_ROLLBACK_FAILED
- code: RUNTIME.TYPE_PARAMS_INVALID
  namespace: RUNTIME
  meaning: 'A parameterized codec''s `paramsSchema` rejected the `typeParams` carried by a codec reference
    (or the schema returned a Promise — runtime validation requires a synchronous Standard Schema validator).
    The `arktype-json` codec also throws it when the contract''s serialized schema expression does not
    match the rehydrated schema, indicating a stale or hand-edited contract. Payload: `codecId`, `typePara'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#RUNTIME.TYPE_PARAMS_INVALID
- code: DRIVER.ALREADY_CONNECTED
  namespace: DRIVER
  meaning: 'Calling `connect(binding)` on a driver — or `connect()` on a target facade client (Postgres,
    SQLite, Mongo) or the CLI control client — that is already connected. Close with `close()` before
    reconnecting with a new binding. Payload: `bindingKind`.'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#DRIVER.ALREADY_CONNECTED
- code: DRIVER.CONNECTION_FAILED
  namespace: DRIVER
  meaning: 'A control-plane driver could not establish a database connection (`driver.create(url)` in
    the SQLite, Postgres, and Mongo control drivers). The `why` carries the underlying driver message
    and the original error is attached as `cause`; connection URLs in meta are redacted. Payload: `path`
    (SQLite); `sqlState` plus redacted URL fields (Postgres); redacted URL fields (Mongo).'
  docs: https://www.prisma.io/docs/orm/reference/error-reference#DRIVER.CONNECTION_FAILED
- code: DRIVER.NOT_CONNECTED
  namespace: DRIVER
  meaning: Using a driver, a target facade client, or the CLI control client before `connect(...)` has
