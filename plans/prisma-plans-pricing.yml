specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Prisma
providerId: prisma
generated: '2026-09-17'
method: searched
source: https://www.prisma.io/pricing
source_markdown: https://www.prisma.io/pricing.md
created: '2026-05-04'
modified: '2026-09-17'
supersedes: >-
  The 2026-05-04 bulk-sweep version of this file, which was method: generated and described a
  Prisma Postgres + Accelerate plan shape that no longer exists. Prisma repriced around Prisma
  Compute + Prisma Postgres when Compute went GA on 2026-08-28.
tags:
  - Database
  - Postgres
  - Developer Tools
  - Application Hosting
description: >-
  Usage-based pricing across both halves of the stack. Prisma Compute bills requests, memory
  GB-hours, active vCPU-hours and outbound bandwidth; Prisma Postgres bills one operation per
  query plus storage. Seats, deploys, preview branches and idle time are free, an idle app scales
  to zero, and every paid plan carries a hard spend limit that is ON BY DEFAULT.
billing_model: usage-based with a monthly platform fee
currency: USD
plan_count: 4
plans:
  - id: prisma-free
    name: Free
    price: 0
    currency: USD
    period: month
    signup: https://console.prisma.io/sign-up
    credit_card_required: false
    note: Free forever, no time limit.
    included:
      compute_requests: 1000000
      compute_memory_gb_hours: 360
      compute_active_vcpu_hours: 4
      compute_outbound_bandwidth_gb: 10
      postgres_operations: 200000
      postgres_storage_mb: 500
      databases: 50
    backups: none
    compliance: []
    overage: none (hard stop at the included quota)
  - id: prisma-starter
    name: Starter
    price: 10
    currency: USD
    period: month
    most_popular: true
    signup: https://console.prisma.io/sign-up
    included:
      compute_requests: 5000000
      postgres_operations: 1000000
      postgres_storage_gb: 10
      databases: 1000
    backups: 7-day daily backups
    compliance: []
    platform: [spend limits]
    overage:
      compute_requests: $1 per million
      compute_memory: $0.006 per GB-hour
      compute_vcpu: $0.064 per active vCPU-hour
      compute_bandwidth: $0.025 per GB outbound
      postgres_operations: $8 per million
      postgres_storage: $2.00 per GB
  - id: prisma-pro
    name: Pro
    price: 49
    currency: USD
    period: month
    signup: https://console.prisma.io/sign-up
    included:
      compute_requests: 20000000
      postgres_operations: 10000000
      postgres_storage_gb: 50
      databases: 1000
    backups: 7-day daily backups
    compliance: [GDPR, HIPAA]
    platform: [spend limits]
    overage:
      compute_requests: $1 per million
      compute_memory: $0.006 per GB-hour
      compute_vcpu: $0.064 per active vCPU-hour
      compute_bandwidth: $0.025 per GB outbound
      postgres_operations: $2 per million
      postgres_storage: $1.50 per GB
  - id: prisma-business
    name: Business
    price: 129
    currency: USD
    period: month
    signup: https://console.prisma.io/sign-up
    included:
      compute_requests: 100000000
      postgres_operations: 50000000
      postgres_storage_gb: 100
      databases: 1000
    backups: 30-day retention
    compliance: [GDPR, HIPAA, SOC 2, ISO 27001]
    platform: [spend limits]
    overage:
      compute_requests: $1 per million
      compute_memory: $0.006 per GB-hour
      compute_vcpu: $0.064 per active vCPU-hour
      compute_bandwidth: $0.025 per GB outbound
      postgres_operations: $1 per million
      postgres_storage: $1.00 per GB
  - id: prisma-enterprise
    name: Custom / Enterprise
    price: null
    currency: USD
    period: null
    note: >-
      "Custom pricing is available for high-volume teams" via https://www.prisma.io/contact.
      Not counted in plan_count because no published price or quota exists.
    contact: https://www.prisma.io/contact
included_on_every_plan:
  - Prisma ORM (always free)
  - Unlimited Prisma Postgres data transfer
  - Spend limits
  - Prisma Studio
  - CLI + Management API
agent_relevant_note: >-
  The pricing page states explicitly that "a request does the same work whether it comes from a
  person, a script, or an AI agent, so that work is all you're charged for" — there is no agent
  surcharge and no separate agent tier. Prisma Compute is positioned for deploying AI agents.
maintainers:
